[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
authors = ["The PayMintRails Developers"]
description = "PayMintRails"
edition = "2024"
homepage = "https://github.com/PayMintRails/paymintrails"
keywords = ["bitcoin", "e-cash", "lightning"]
license-file = "LICENSE"
readme = "README.md"
repository = "https://github.com/PayMintRails/paymintrails.git"
rust-version = "1.85.0"
version = "0.1.0"

[workspace.dependencies]

[workspace.lints.clippy]
literal_string_with_formatting_args = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
use_debug = "warn"

[workspace.lints.rust]
dead_code = "warn"
missing_debug_implementations = "warn"
non_ascii_idents = "deny"
unreachable_pub = "warn"
unsafe_code = "forbid"
unused_imports = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
missing_docs = "warn"

[workspace.metadata.crane]
name = "paymintrails"

[profile.dev]
debug = "line-tables-only"

# Workaround: https://github.com/rust-lang/cargo/issues/12457 which causes
#             https://github.com/ipetkov/crane/issues/370
[profile.dev.build-override]
debug = false
opt-level = 3

[profile.release]
debug = "line-tables-only"
lto = "thin"
